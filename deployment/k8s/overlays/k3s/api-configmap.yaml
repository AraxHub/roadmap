apiVersion: v1
kind: ConfigMap
metadata:
  name: roadmap-api-env
  namespace: roadmap
data:
  ROADMAP_ENV: "prod"
  ROADMAP_SERVER_HOST: "0.0.0.0"
  ROADMAP_SERVER_PORT: "8080"

  # Host Postgres (docker on VPS, outside k3s). See deployment/postgres/.
  # ROADMAP_DB_HOST задаётся в patch-api-env.yaml через status.hostIP (IP ноды).
  ROADMAP_DB_PORT: "5432"
  ROADMAP_DB_USER: "roadmap_app"
  ROADMAP_DB_NAME: "roadmap"
  ROADMAP_DB_SSLMODE: "disable"

  ROADMAP_AUTH_ACCESS_TTL: "15m"
  ROADMAP_AUTH_REFRESH_TTL: "72h"
  ROADMAP_AUTH_REFRESH_COOKIE_NAME: "refresh_token"
  ROADMAP_AUTH_REFRESH_COOKIE_SECURE: "true"
  ROADMAP_AUTH_REFRESH_COOKIE_PATH: "/api/v1/auth"
  ROADMAP_AUTH_BOOTSTRAP_LOGIN: "admin"

  ROADMAP_SPRINT_DURATION: "168h"

  # REPLACE host with the same domain as Ingress.
  ROADMAP_TELEGRAM_BOT_USERNAME: ""
  ROADMAP_TELEGRAM_WEBHOOK_URL: "https://roadmap.example.ru/api/v1/telegram/webhook"
  ROADMAP_TELEGRAM_FEEDBACK_TZ: "Europe/Moscow"
