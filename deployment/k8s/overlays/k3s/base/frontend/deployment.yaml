apiVersion: apps/v1
kind: Deployment
metadata:
  name: roadmap-frontend
  namespace: roadmap
spec:
  replicas: 1
  selector:
    matchLabels:
      app: roadmap-frontend
  template:
    metadata:
      labels:
        app: roadmap-frontend
    spec:
      containers:
        - name: frontend
          image: roadmap-frontend:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
