apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: roadmap

resources:
  - base/namespace.yaml
  - base/api/deployment.yaml
  - base/api/service.yaml
  - base/frontend/deployment.yaml
  - base/frontend/service.yaml
  - base/ingress.yaml
  - api-configmap.yaml

images:
  - name: roadmap-api
    newName: ghcr.io/araxhub/roadmap-api
    newTag: latest
  - name: roadmap-frontend
    newName: ghcr.io/araxhub/roadmap-frontend
    newTag: latest

patches:
  - path: patch-api-env.yaml
  - path: patch-api-image.yaml
  - path: patch-frontend-image.yaml
