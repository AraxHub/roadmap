services:
  postgres:
    container_name: roadmap-postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: roadmap
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 2s
      retries: 5

  roadmap:
    container_name: roadmap-app
    build:
      context: ../..
      dockerfile: deployment/roadmap-local/Dockerfile
    ports:
      - "8080:8080"
    environment:
      ROADMAP_SERVER_HOST: 0.0.0.0
      ROADMAP_SERVER_PORT: 8080
      ROADMAP_ENV: ${ROADMAP_ENV:-dev}
      ROADMAP_DB_HOST: postgres
      ROADMAP_DB_PORT: 5432
      ROADMAP_DB_USER: postgres
      ROADMAP_DB_PASSWORD: postgres
      ROADMAP_DB_NAME: roadmap
      ROADMAP_DB_SSLMODE: disable
      ROADMAP_AUTH_JWT_SECRET: ${ROADMAP_AUTH_JWT_SECRET:-dev-secret-change-me}
      ROADMAP_AUTH_ACCESS_TTL: 15m
      ROADMAP_AUTH_REFRESH_TTL: 72h
      ROADMAP_AUTH_REFRESH_COOKIE_SECURE: "false"
      ROADMAP_AUTH_BOOTSTRAP_LOGIN: ${ROADMAP_AUTH_BOOTSTRAP_LOGIN:-admin}
      ROADMAP_AUTH_BOOTSTRAP_PASSWORD: ${ROADMAP_AUTH_BOOTSTRAP_PASSWORD:-admin}
      ROADMAP_SPRINT_DURATION: ${ROADMAP_SPRINT_DURATION:-168h}
      ROADMAP_TELEGRAM_BOT_TOKEN: ${ROADMAP_TELEGRAM_BOT_TOKEN:-}
      ROADMAP_TELEGRAM_BOT_USERNAME: ${ROADMAP_TELEGRAM_BOT_USERNAME:-}
      ROADMAP_TELEGRAM_WEBHOOK_SECRET: ${ROADMAP_TELEGRAM_WEBHOOK_SECRET:-}
      ROADMAP_TELEGRAM_WEBHOOK_URL: ${ROADMAP_TELEGRAM_WEBHOOK_URL:-}
      ROADMAP_TELEGRAM_POLLING_TIMEOUT: ${ROADMAP_TELEGRAM_POLLING_TIMEOUT:-30}
      ROADMAP_TELEGRAM_FEEDBACK_TZ: ${ROADMAP_TELEGRAM_FEEDBACK_TZ:-Europe/Moscow}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    container_name: roadmap-frontend
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      roadmap:
        condition: service_started
