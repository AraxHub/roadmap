name: Pipeline

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pipeline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  test-api:
    name: Test API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: CGO_ENABLED=0 go build -o /tmp/roadmap ./cmd/roadmap

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck & build
        run: npm run build

  publish:
    name: Build & push images
    needs: [test-api, test-frontend]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: api
            image: roadmap-api
            file: deployment/k8s/images/api/Dockerfile
            context: .
          - name: frontend
            image: roadmap-frontend
            file: deployment/k8s/images/frontend/Dockerfile
            context: .
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name
        id: meta
        run: |
          owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          image="${{ env.REGISTRY }}/${owner}/${{ matrix.image }}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "tags=${image}:sha-${GITHUB_SHA::7},${image}:latest" >> "$GITHUB_OUTPUT"

      - name: Build and push (${{ matrix.name }})
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    name: Deploy to VPS
    needs: [publish]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script: |
            set -euo pipefail
            SHORT='${{ github.sha }}'
            SHORT="${SHORT:0:7}"
            OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
            API_IMG="ghcr.io/${OWNER}/roadmap-api:sha-${SHORT}"
            FE_IMG="ghcr.io/${OWNER}/roadmap-frontend:sha-${SHORT}"
            echo "Deploying API=${API_IMG}"
            echo "Deploying FE=${FE_IMG}"
            kubectl -n roadmap set image deploy/roadmap-api api="${API_IMG}"
            kubectl -n roadmap set image deploy/roadmap-frontend frontend="${FE_IMG}"
            kubectl -n roadmap rollout status deploy/roadmap-api --timeout=180s
            kubectl -n roadmap rollout status deploy/roadmap-frontend --timeout=180s
            kubectl -n roadmap get pods -o wide
